// Display all recipes when the page loads

function normalizeIngredient(ingredient) {
  return ingredient
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");
}


function findRecipes() {

  const input = document
    .getElementById("ingredientsInput")
    .value
    .toLowerCase();

  if (!input.trim()) {
    displayRecipes(recipes);
    document.getElementById("results-title").textContent =
      "🍽️ All 50 Recipes";
    return;
  }

  const userIngredients = input
    .split(",")
    .map(normalizeIngredient)
    .filter(item => item.length > 0);


  const matches = recipes.map(recipe => {

    const matchedIngredients = recipe.ingredients.filter(
      ingredient =>
        userIngredients.some(userIngredient =>
          ingredient.includes(userIngredient) ||
          userIngredient.includes(ingredient)
        )
    );

    return {
      ...recipe,
      matchedIngredients: matchedIngredients
    };

  });


  // Sort recipes by the number of ingredients the user has.
  matches.sort(
    (a, b) =>
      b.matchedIngredients.length -
      a.matchedIngredients.length
  );


  // Only show recipes with at least one matching ingredient.
  const results = matches.filter(
    recipe => recipe.matchedIngredients.length > 0
  );


  displayRecipes(results);

  document.getElementById("results-title").textContent =
    results.length > 0
      ? `🍽️ ${results.length} Recipe Suggestions`
      : "😕 No Matching Recipes";
}


function displayRecipes(recipeList) {

  const resultsContainer =
    document.getElementById("results");

  resultsContainer.innerHTML = "";


  if (recipeList.length === 0) {

    resultsContainer.innerHTML = `
      <div class="no-results">
        <h3>No recipes found.</h3>
        <p>
          Try adding more ingredients to your kitchen list.
        </p>
      </div>
    `;

    return;
  }


  recipeList.forEach(recipe => {

    const card = document.createElement("div");

    card.className = "recipe-card";


    const matchCount =
      recipe.matchedIngredients
        ? recipe.matchedIngredients.length
        : 0;


    const matchText =
      matchCount > 0
        ? `<span class="match">
             ${matchCount} ingredient${matchCount > 1 ? "s" : ""} matched
           </span>`
        : "";


    card.innerHTML = `

      <h3>${recipe.name}</h3>

      ${matchText}

      <h4>Ingredients:</h4>

      <ul>
        ${recipe.ingredients
          .map(ingredient => `<li>${ingredient}</li>`)
          .join("")}
      </ul>

    `;


    resultsContainer.appendChild(card);

  });
}


function clearSearch() {

  document.getElementById("ingredientsInput").value = "";

  document.getElementById("results-title").textContent =
    "🍽️ All 50 Recipes";

  displayRecipes(recipes);
}
